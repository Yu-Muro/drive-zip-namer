name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "26"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit tests
        run: npm test

  validate:
    name: Validate manifest & build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Validate manifest.json and version consistency
        run: npm run validate

      - name: Check JavaScript syntax
        run: npm run syntax

      - name: Generate icons
        run: npm run icons

      - name: Verify image assets
        run: npm run verify-assets

      - name: Build distribution package
        run: npm run package

      - name: Verify distribution package
        run: npm run verify-package

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: drive-zip-namer-extension
          path: dist/*.zip
          if-no-files-found: error
