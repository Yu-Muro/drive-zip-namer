name: 機能提案
description: 新機能や改善案を提案します
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。解決したい課題と期待する体験を教えてください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現在どのような場面で困っているかを入力してください。
      placeholder: 「〜するときに、〜できず困っています」
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 希望する解決方法
      description: どのような機能や動作があると解決できるかを入力してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 現在の回避策や、ほかに検討した方法があれば入力してください。

  - type: textarea
    id: additional-context
    attributes:
      label: 補足情報
      description: 参考画像、関連リンク、具体的な利用例などがあれば追加してください。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueに同じ内容がないことを確認しました。
          required: true
