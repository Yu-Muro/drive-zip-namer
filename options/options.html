<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title data-i18n="optionsTitle">Drive Zip Namer - 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsHeading">Drive Zip Namer 設定</h1>

    <section>
      <label for="default-template" data-i18n="defaultTemplateLabel">既定テンプレート（ダウンロード時ダイアログの初期値）</label>
      <input id="default-template" type="text" maxlength="500" data-i18n-placeholder="defaultTemplatePlaceholder" placeholder="例: {date}_{folder}">
      <p class="note" data-i18n="templateHintPeriod">{date} {time} {datetime} {project} {folder} {count} が使えます。</p>
      <p id="default-template-error" class="form-error" role="alert" hidden></p>
    </section>

    <section>
      <label for="save-folder" data-i18n="saveFolderLabel">保存先サブフォルダ（ダウンロードフォルダ内）</label>
      <input id="save-folder" type="text" maxlength="180" data-i18n-placeholder="saveFolderPlaceholder" placeholder="例: GoogleDrive（空欄で直下に保存）">
    </section>

    <section>
      <label class="check">
        <input id="prompt-on-download" type="checkbox" checked>
        <span data-i18n="promptOnDownload">Drive の ZIP ダウンロード時に、名前入力ダイアログを表示する</span>
      </label>
      <p class="note" data-i18n="promptOffNote">
        オフにすると、ポップアップで事前に名前を予約したときだけ差し替えます。
      </p>
    </section>

    <section>
      <span class="group-label" data-i18n="conflictLabel">同名ファイルがある場合</span>
      <label class="radio"><input type="radio" name="conflict" value="uniquify" checked> <span data-i18n="conflictUniquify">自動連番を付ける</span></label>
      <label class="radio"><input type="radio" name="conflict" value="overwrite"> <span data-i18n="conflictOverwrite">上書きする</span></label>
      <label class="radio"><input type="radio" name="conflict" value="prompt"> <span data-i18n="conflictPrompt">確認ダイアログを出す</span></label>
    </section>

    <section>
      <label class="check">
        <input id="allow-multiple" type="checkbox" checked>
        <span data-i18n="allowMultiple">分割ZIPに対応する（最初のZIPから30秒間、同じ名前 + _part2, _part3… を適用）</span>
      </label>
      <label class="check">
        <input id="auto-clear" type="checkbox" checked>
        <span data-i18n="autoClear">使用後に予約を自動でクリアする（分割ZIP対応が無効のとき）</span>
      </label>
    </section>

    <button id="save" class="primary" data-i18n="save">保存</button>
    <span id="saved-note" data-i18n="saved" hidden>保存しました</span>

    <hr>

    <section>
      <h2 data-i18n="presetsHeading">案件別プリセット</h2>
      <p class="note" data-i18n="presetsNote">よく使う命名テンプレートを保存しておくと、ポップアップやダウンロード時ダイアログからワンクリックで呼び出せます。</p>
      <table id="presets-table">
        <thead>
          <tr><th data-i18n="name">名前</th><th data-i18n="template">テンプレート</th><th data-i18n="actions">操作</th></tr>
        </thead>
        <tbody id="presets-body"></tbody>
      </table>
      <div class="preset-add">
        <input id="preset-name" type="text" maxlength="80" data-i18n-placeholder="presetNamePlaceholder" placeholder="名前（例: 請求書）">
        <input id="preset-template" type="text" maxlength="500" data-i18n-placeholder="presetTemplatePlaceholder" placeholder="テンプレート（例: {date}_請求書）">
        <button id="preset-add-btn" class="secondary" type="button" data-i18n="add">追加</button>
      </div>
      <p id="preset-error" class="form-error" role="alert" hidden></p>
    </section>

    <hr>

    <section>
      <h2 data-i18n="backupHeading">設定のバックアップ</h2>
      <p class="note" data-i18n="backupDescription">設定とプリセットを JSON ファイルで書き出し・読み込みできます。チームで命名ルールを共有するのに使えます。</p>
      <div class="backup-actions">
        <button id="export-btn" class="secondary" type="button" data-i18n="export">エクスポート</button>
        <button id="import-btn" class="secondary" type="button" data-i18n="import">インポート</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="backup-note" class="backup-note" hidden></p>
    </section>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
