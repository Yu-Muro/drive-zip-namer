<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Drive Zip Namer - 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Drive Zip Namer 設定</h1>

    <section>
      <label for="default-template">既定テンプレート（ダウンロード時ダイアログの初期値）</label>
      <input id="default-template" type="text" placeholder="例: {date}_{folder}">
      <p class="note">{date} {time} {datetime} {project} {folder} {count} が使えます。</p>
    </section>

    <section>
      <label for="save-folder">保存先サブフォルダ（ダウンロードフォルダ内）</label>
      <input id="save-folder" type="text" placeholder="例: GoogleDrive（空欄で直下に保存）">
    </section>

    <section>
      <label class="check">
        <input id="prompt-on-download" type="checkbox" checked>
        Drive の ZIP ダウンロード時に、名前入力ダイアログを表示する
      </label>
      <p class="note">
        オフにすると、ポップアップで事前に名前を予約したときだけ差し替えます。
      </p>
    </section>

    <section>
      <span class="group-label">同名ファイルがある場合</span>
      <label class="radio"><input type="radio" name="conflict" value="uniquify" checked> 自動連番を付ける</label>
      <label class="radio"><input type="radio" name="conflict" value="overwrite"> 上書きする</label>
      <label class="radio"><input type="radio" name="conflict" value="prompt"> 確認ダイアログを出す</label>
    </section>

    <section>
      <label class="check">
        <input id="allow-multiple" type="checkbox" checked>
        分割ZIPに対応する（最初のZIPから30秒間、同じ名前 + _part2, _part3… を適用）
      </label>
      <label class="check">
        <input id="auto-clear" type="checkbox" checked>
        使用後に予約を自動でクリアする（分割ZIP対応が無効のとき）
      </label>
    </section>

    <button id="save" class="primary">保存</button>
    <span id="saved-note" hidden>保存しました</span>

    <hr>

    <section>
      <h2>案件別プリセット</h2>
      <p class="note">よく使う命名テンプレートを保存しておくと、ポップアップやダウンロード時ダイアログからワンクリックで呼び出せます。</p>
      <table id="presets-table">
        <thead>
          <tr><th>名前</th><th>テンプレート</th><th></th></tr>
        </thead>
        <tbody id="presets-body"></tbody>
      </table>
      <div class="preset-add">
        <input id="preset-name" type="text" placeholder="名前（例: 請求書）">
        <input id="preset-template" type="text" placeholder="テンプレート（例: {date}_請求書）">
        <button id="preset-add-btn" class="secondary" type="button">追加</button>
      </div>
    </section>

    <hr>

    <section>
      <h2>設定のバックアップ</h2>
      <p class="note">設定とプリセットを JSON ファイルで書き出し・読み込みできます。チームで命名ルールを共有するのに使えます。</p>
      <div class="backup-actions">
        <button id="export-btn" class="secondary" type="button">エクスポート</button>
        <button id="import-btn" class="secondary" type="button">インポート</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="backup-note" class="backup-note" hidden></p>
    </section>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
